[package]
name = "keepass-2-file"
version.workspace = true
authors.workspace = true
edition.workspace = true

[workspace]
members=["crates/*"]
resolver="2"

[workspace.package]
authors = ["Jaume Singla"]
version = "1.0.1"
edition = "2024"

[workspace.dependencies]
test_helpers = {path="crates/test_helpers"}
uuid = "1.23.1"

[dependencies]
keepass = "0.14.0"
serde = { version = "1.0.0", features=["derive"] }
serde_json = "1.0.39"
handlebars="6.2.0"
clap = { version = "4.5.21", features = ["derive"] }
clap_complete = "4.5.21"
serde_yaml = "0.9.34"
rpassword = "7.3.1"
dirs = "7.0.0"
colored = "3.0.0"
pathdiff = "0.2.3"

[dev-dependencies]
test_helpers = { workspace = true}

[features]
keep-test-files = []
